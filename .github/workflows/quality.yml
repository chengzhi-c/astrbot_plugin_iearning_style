name: quality

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pytest pytest-cov ruff
      - run: python -m pytest tests -q --cov=learning_style --cov-fail-under=85
      - run: ruff check main.py learning_style tests
      - run: python -m compileall -q main.py learning_style tests
      - name: Check Python 3.10 syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          for root in (Path("main.py"), Path("learning_style"), Path("tests")):
              paths = [root] if root.is_file() else root.rglob("*.py")
              for path in paths:
                  ast.parse(path.read_text(encoding="utf-8"), filename=str(path), feature_version=(3, 10))
          PY
      - run: git diff --check HEAD^ HEAD

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Check JavaScript syntax
        run: find pages/style-manager/src tests/frontend -name '*.js' -o -name '*.mjs' | xargs -n1 node --check
      - run: git diff --check HEAD^ HEAD
